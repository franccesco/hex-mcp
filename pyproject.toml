[project]
name = "hex-mcp"
version = "0.1.10"
description = "A MCP server for Hex"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "backoff>=2.2.1",
 "mcp>=1.3.0",
 "python-dotenv>=1.0.1",
 "httpx>=0.27.0",
 "typer>=0.15.2",
 "pyyaml>=6.0.2",
]
[[project.authors]]
name = "Franccesco Orozco"
email = "franccesco@codingdose.info"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mcp[cli]>=1.3.0",
]

[project.scripts]
hex-mcp = "hex_mcp:main_entry"

[project.optional-dependencies]
dev = [
  "mcp[cli]>=1.3.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (require test API key)",
    "e2e: marks tests as end-to-end tests (require full test workspace)",
]
